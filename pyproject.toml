[project]
name = "sed"
version = "0.1.0"
description = "Sound event detection for interactive lighting installations"
requires-python = ">=3.11,<3.13"
readme = "README.md"

dependencies = [
    # Core
    "numpy>=1.26,<2.2",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tomli>=2.0; python_version<'3.11'",
    "typer[all]>=0.12",
    "rich>=13.7",

    # Audio I/O — needed by every machine (recording, inference)
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "librosa>=0.10.1",

    # Inference (lightweight; safe to install on edge devices)
    "onnxruntime>=1.17",
    "openvino>=2024.4",

    # Visualization / inspection — needed for `clinkd inspect`
    "matplotlib>=3.8",
    "jinja2>=3.1",

    # Lighting
    "stupidArtnet>=1.4",

    # IPC (decouple detection ↔ show controller)
    "pyzmq>=25",
]

[project.optional-dependencies]
# Heavy ML deps — only the training workstation needs these. The edge device
# uses the exported OpenVINO model and never imports torch.
train = [
    "torch>=2.2,<2.6",
    "torchaudio>=2.2,<2.6",
    "torchvision>=0.17,<0.21",     # required by EfficientAT submodule
    "lightning>=2.2",
    "torchmetrics>=1.3",
    "timm>=1.0",                   # fallback backbone if EfficientAT unavailable
    "audiomentations>=0.34",
    "onnx>=1.15",
    "nncf>=2.10",
    "umap-learn>=0.5.5",
    "scikit-learn>=1.4",
]

# Dev tools — tests + linters
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
# The CLI binary is `clinkd` (clink-detector). We deliberately do NOT name
# it `sed` because that collides with the Unix stream editor `sed(1)` —
# install scripts and Makefiles routinely invoke `sed` for text substitution,
# and shadowing it breaks them. The Python package name (sed) is kept since
# it's only used by `from sed.foo import bar`, which has no name collision.
clinkd = "sed.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
